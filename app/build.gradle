دمجplugins {
    id 'com.android.application'
}

android {
    namespace "com.sanad.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.sanad.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
🛡️ سَنَد | SANAD

الشعار: أنت مش لوحدك.. سَنَد معاك.

وصف التطبيق

سَنَد هو تطبيق احترافي للحماية الرقمية ومساعدة الأشخاص في مواجهة الابتزاز الإلكتروني والتهديد والتنمر والمواقف الطارئة. يهدف التطبيق إلى توفير بيئة آمنة تساعد المستخدمين على حماية خصوصيتهم، وحفظ الأدلة الرقمية، وطلب المساعدة، والوصول إلى إرشادات وجهات دعم موثوقة.

المميزات الأساسية

1. خزنة الأدلة: مساحة خاصة وآمنة لحفظ صور المحادثات والرسائل والروابط والتواريخ، مع إمكانية تصدير الأدلة في ملف منظم.

2. استغاثة سريعة: زر طوارئ يرسل رسالة استغاثة وموقع المستخدم إلى جهات الاتصال الموثوقة بعد موافقته.

3. مساعد الابتزاز الإلكتروني: قسم يقدم إرشادات عملية للتعامل مع الابتزاز والتهديد، وكيفية الإبلاغ والحفاظ على الأدلة وطلب المساعدة.

4. فحص الأمان الرقمي: أدوات إرشادية تساعد المستخدم على مراجعة إعدادات الخصوصية وأمان الحسابات وكلمات المرور.

5. المساعد الذكي: مساعد ذكاء اصطناعي يجيب عن أسئلة المستخدمين ويساعدهم على فهم المواقف الصعبة والتصرف بأمان دون لوم أو أحكام.

6. دائرة الأمان: إمكانية إضافة أشخاص موثوقين وإدارة جهات الاتصال المخصصة للطوارئ ومشاركة الموقع بموافقة المستخدم.

مميزات إضافية احترافية

- واجهة عربية سهلة الاستخدام بالكامل.
- دعم الوضع الليلي والنهاري.
- قفل التطبيق بالبصمة أو الرقم السري.
- حماية بيانات المستخدم وتشفير المعلومات الحساسة.
- إمكانية حذف البيانات والتحكم الكامل فيها.
- قسم للتوعية بمخاطر الإنترنت والاحتيال الإلكتروني.
- دليل بجهات المساعدة والإبلاغ الموثوقة.
- إشعارات تنبيهية ونصائح للحماية.
- إمكانية استخدام بعض الأدوات دون إنترنت.
- إمكانية الإبلاغ عن مشكلة داخل التطبيق.

شكل وتصميم التطبيق

- الألوان: كحلي داكن مع التركواز والأبيض.
- التصميم: عصري واحترافي وبسيط.
- الشعار: درع بداخله علامة حماية.
- الأيقونات: واضحة وسهلة الفهم.
- التصميم متوافق مع هواتف Android وiPhone.
- اللغة الأساسية: العربية، مع إمكانية إضافة الإنجليزية.

أقسام الصفحة الرئيسية

1. زر استغاثة سريع.
2. خزنة الأدلة.
3. الحماية من الابتزاز.
4. المساعد الذكي.
5. دائرة الأمان.
6. فحص الأمان الرقمي.
7. دليل المساعدة.
8. نصائح الحماية.

الهدف من التطبيق

إنشاء منصة حماية ومساعدة حقيقية تجعل الوصول إلى الدعم والإرشادات أسهل، وتساعد الأشخاص على حماية أنفسهم وخصوصيتهم، مع الاهتمام بأمان البيانات وسرية المعلومات.

مهم في التنفيذ: لا يجوز للتطبيق حذف بيانات أجهزة الآخرين أو الوصول إلى هواتفهم دون إذن. يجب أن تعتمد كل أدوات الحماية على موافقة المستخدم وصلاحيات واضحة، وألا يُقدَّم المساعد الذكي باعتباره جهة طوارئ أو بديلًا عن المختصين.